[[builders]]
id = "create_room_request_packet"
args = ["trace_id", "local_profile_id", "team_structure", "team_assignment_mode", "team_count", "max_players", "preset_id", "starting_lives", "infinite_lives", "target_score"]

[builders.body]
type = "create_room_request"
trace_id = "$trace_id"
local_profile_id = "$local_profile_id"
team_structure = "$team_structure"
team_assignment_mode = "$team_assignment_mode"
team_count = "$team_count"
max_players = "$max_players"
preset_id = "$preset_id"
starting_lives = "$starting_lives"
infinite_lives = "$infinite_lives"
target_score = "$target_score"

[[builders]]
id = "join_room_request_packet"
args = ["room_code", "trace_id"]

[builders.body]
type = "join_room_request"
room_code = "$room_code"
trace_id = "$trace_id"

[[builders]]
id = "leave_room_request_packet"

[builders.body]
type = "leave_room_request"

[[builders]]
id = "set_ready_request_packet"
args = ["ready"]

[builders.body]
type = "set_ready_request"
ready = "$ready"

[[builders]]
id = "set_team_assignment_request_packet"
args = ["target_player_id", "team_id"]

[builders.body]
type = "set_team_assignment_request"
target_player_id = "$target_player_id"
team_id = "$team_id"

[[builders]]
id = "loadout_options_request_packet"
args = ["trace_id", "local_profile_id", "play_mode", "mode_id"]

[builders.body]
type = "loadout_options_request"
trace_id = "$trace_id"
local_profile_id = "$local_profile_id"
play_mode = "$play_mode"
mode_id = "$mode_id"

[[builders]]
id = "set_loadout_request_packet"
args = ["trace_id", "selected_owned_ship_id", "selected_weapons_by_point", "selected_modules_by_slot", "starting_ammo_by_point"]

[builders.body]
type = "set_loadout_request"
trace_id = "$trace_id"
selected_owned_ship_id = "$selected_owned_ship_id"
selected_weapons_by_point = "$selected_weapons_by_point"
selected_modules_by_slot = "$selected_modules_by_slot"
starting_ammo_by_point = "$starting_ammo_by_point"

[[builders]]
id = "start_game_request_packet"

[builders.body]
type = "start_game_request"

[[builders]]
id = "add_bot_request_packet"

[builders.body]
type = "add_bot_request"

[[builders]]
id = "remove_room_member_request_packet"
args = ["player_id"]

[builders.body]
type = "remove_room_member_request"
player_id = "$player_id"

[[builders]]
id = "start_single_player_request_packet"
args = ["local_profile_id", "trace_id"]

[builders.body]
type = "start_single_player_request"
local_profile_id = "$local_profile_id"
trace_id = "$trace_id"

[[builders]]
id = "return_to_lobby_request_packet"

[builders.body]
type = "return_to_lobby_request"

[[builders]]
