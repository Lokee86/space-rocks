schema_version = 1

[[events]]
name = "log_message"
category = "legacy_log"
default_level = "info"
description = "Temporary bridge event for legacy logging call sites; normal canonical emission is forbidden."
services = ["client", "game_server", "player_data", "diagnostic_aggregator"]
trace_required = false
audit_eligible = false
retention_tier = "operational"
bridge_only = true

# Permanent stable event catalog for current technical-release observability.
# Event names are intentionally lifecycle-, failure-, degradation-, audit-, or
# threshold-oriented; high-frequency success samples remain metrics/devtools data.

