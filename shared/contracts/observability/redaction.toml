[policy]
name = "observability_redaction"
version = 1
description = "Mandatory rejection and future redaction policy for unsafe observability data."
recursive = true
scan_paths = ["envelope", "fields"]

[key_matching]
case_sensitive = false
normalize_before_matching = true
normalized_separators = ["_", "-", ".", "/", "\\", " "]
separator_replacement = ""
configured_keys_follow_normalization = true
configured_key_normalization = "Configured rule keys are normalized with these same case and separator rules before matching incoming keys."

[actions]
supported = ["reject_event", "redact_value", "drop_field"]
initial_mandatory_action = "reject_event"

[rejection_metadata]
allowed_fields = ["rule_id", "normalized_field_path", "reason_code"]
rejected_value_allowed = false

[redaction]
replacement = "[REDACTED]"

[[rule]]
id = "forbidden_auth_transport_fields"
description = "Reject authorization credentials, authentication headers, and cookies."
action = "reject_event"
match = "exact_key"
keys = [
  "authorization",
  "auth",
  "auth_header",
  "authentication",
  "authentication_header",
  "cookie",
  "cookies",
  "set_cookie"
]
reason_code = "forbidden_auth_data"

[[rule]]
id = "forbidden_credential_fields"
description = "Reject access, refresh, bearer, identity, OAuth, API-key, password, secret, and one-time credential fields."
action = "reject_event"
match = "exact_key"
keys = [
  "access_token",
  "access_token_value",
  "refresh_token",
  "refresh_token_value",
  "bearer_token",
  "id_token",
  "identity_token",
  "oauth_code",
  "oauth_token",
  "api_key",
  "apikey",
  "api_secret",
  "password",
  "passphrase",
  "secret",
  "secret_key",
  "private_key",
  "signing_key",
  "encryption_key",
  "otp",
  "otp_code",
  "mfa_code",
  "one_time_code"
]
reason_code = "forbidden_credential_data"

[[rule]]
id = "forbidden_financial_fields"
description = "Reject payment-card and bank-account data."
action = "reject_event"
match = "exact_key"
keys = [
  "card_number",
  "cardholder_name",
  "card_expiry",
  "expiration_date",
  "cvv",
  "cvc",
  "pin",
  "bank_account",
  "bank_account_number",
  "account_number",
  "routing_number",
  "iban",
  "swift_code"
]
reason_code = "forbidden_financial_data"

[[rule]]
id = "forbidden_raw_content_fields"
description = "Reject raw profiles, packets, payloads, bodies, provider data, webhook data, and unrestricted header containers."
action = "reject_event"
match = "exact_key"
keys = [
  "private_profile",
  "raw_profile",
  "raw_packet",
  "raw_packets",
  "packet_payload",
  "raw_payload",
  "payload",
  "request_body",
  "response_body",
  "body",
  "provider_payload",
  "webhook_payload",
  "headers",
  "request_headers",
  "response_headers"
]
reason_code = "forbidden_raw_content"

[[rule]]
id = "bearer_credential_value"
description = "Reject explicit Bearer credentials wherever they occur in a scalar value."
action = "reject_event"
match = "value_pattern"
pattern = "(?i)^\\s*Bearer\\s+[^\\s]+\\s*$"
reason_code = "forbidden_bearer_credential"

[[rule]]
id = "private_key_pem_header"
description = "Reject private-key PEM material wherever it occurs in a scalar value."
action = "reject_event"
match = "value_pattern"
pattern = "-----BEGIN (?:RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----"
reason_code = "forbidden_private_key_material"
