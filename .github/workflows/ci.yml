name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/game-server/go.mod
          cache: false
      - name: Install Python tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Pitlord
        run: |
          mkdir -p "$RUNNER_TEMP/pitlord-bin"
          GOBIN="$RUNNER_TEMP/pitlord-bin" go install github.com/Lokee86/pitlord/cmd/pitlord@v0.1.1
          echo "$RUNNER_TEMP/pitlord-bin" >> "$GITHUB_PATH"
      - name: Build Lexicon and Arcana
        env:
          GRIMOIRE_COMMIT: 42c461b2590010c5717d8f1191a9a85e9c5ff202
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Lokee86/grimoire.git "$RUNNER_TEMP/grimoire"
          git -C "$RUNNER_TEMP/grimoire" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/grimoire" sparse-checkout set lexicon arcana
          git -C "$RUNNER_TEMP/grimoire" checkout "$GRIMOIRE_COMMIT"
          npm ci --prefix "$RUNNER_TEMP/grimoire/lexicon/adapters/typescript"
          (
            cd "$RUNNER_TEMP/grimoire/lexicon"
            go build -o "$RUNNER_TEMP/pitlord-bin/lexicon" ./cmd/lexicon
          )
          cargo build --manifest-path "$RUNNER_TEMP/grimoire/arcana/Cargo.toml" --release
          cp "$RUNNER_TEMP/grimoire/arcana/target/release/arcana" "$RUNNER_TEMP/pitlord-bin/arcana"
          echo "LEXICON_ADAPTERS=$RUNNER_TEMP/grimoire/lexicon/adapters" >> "$GITHUB_ENV"
      - name: Run repository checks
        env:
          LEXICON_MAX_WORKERS: '4'
        run: bash tools/ci/run_repo_checks.sh

  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/game-server/go.mod
          cache-dependency-path: services/game-server/go.sum
      - name: Run Go tests
        run: bash tools/ci/run_go_tests.sh

  client-tests:
    name: Client GUT tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Verify Godot
        run: godot --version
      - name: Run client checks
        env:
          GODOT_ARTIFACT_DIR: ${{ runner.temp }}/godot-artifacts
          GODOT_REQUIRE_XVFB: '1'
        run: bash tools/ci/run_client_tests.sh
      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/godot-artifacts
          if-no-files-found: warn
