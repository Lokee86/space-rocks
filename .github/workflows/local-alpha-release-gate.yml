name: Local Packaged Alpha Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'local-v*'
    paths:
      - '.github/workflows/local-alpha-release-gate.yml'
      - 'client/**'
      - 'services/game-server/**'
      - 'services/player-data/**'
      - 'shared/go/**'
      - 'tools/release/**'
  pull_request:
    paths:
      - '.github/workflows/local-alpha-release-gate.yml'
      - 'client/**'
      - 'services/game-server/**'
      - 'services/player-data/**'
      - 'shared/go/**'
      - 'tools/release/**'

concurrency:
  group: local-alpha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-local-alpha:
    name: Windows local alpha
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Read release version
        id: release_version
        shell: pwsh
        run: |
          $version = (Get-Content 'tools/release/version.txt' -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/game-server/go.mod
          cache-dependency-path: |
            services/game-server/go.sum
            services/player-data/go.sum
      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Build and verify Windows package
        run: python tools/release/package_local_alpha.py --platform windows --godot "$env:GODOT" --version "${{ steps.release_version.outputs.version }}"
      - name: Create Windows release archive
        shell: pwsh
        run: Compress-Archive -Path 'dist/local-alpha/windows/*' -DestinationPath 'dist/space-rocks-${{ steps.release_version.outputs.version }}-windows-x86_64.zip' -Force
      - name: Upload tested Windows package
        uses: actions/upload-artifact@v7
        with:
          name: space-rocks-${{ steps.release_version.outputs.version }}-windows-${{ github.sha }}
          path: dist/local-alpha/windows
          if-no-files-found: error
      - name: Upload Windows release archive
        uses: actions/upload-artifact@v7
        with:
          name: space-rocks-${{ steps.release_version.outputs.version }}-windows-x86_64.zip
          path: dist/space-rocks-${{ steps.release_version.outputs.version }}-windows-x86_64.zip
          archive: false
          if-no-files-found: error

  macos-local-alpha:
    name: macOS local alpha
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Read release version
        id: release_version
        run: echo "version=$(tr -d '\r\n' < tools/release/version.txt)" >> "$GITHUB_OUTPUT"
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/game-server/go.mod
          cache-dependency-path: |
            services/game-server/go.sum
            services/player-data/go.sum
      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Build and verify macOS package
        run: python3 tools/release/package_local_alpha.py --platform macos --adhoc-sign --version "${{ steps.release_version.outputs.version }}"
      - name: Create macOS release archive
        run: ditto -c -k --sequesterRsrc dist/local-alpha/macos "dist/space-rocks-${{ steps.release_version.outputs.version }}-macos.zip"
      - name: Upload tested macOS package
        uses: actions/upload-artifact@v7
        with:
          name: space-rocks-${{ steps.release_version.outputs.version }}-macos-${{ github.sha }}
          path: dist/local-alpha/macos
          if-no-files-found: error
      - name: Upload macOS release archive
        uses: actions/upload-artifact@v7
        with:
          name: space-rocks-${{ steps.release_version.outputs.version }}-macos.zip
          path: dist/space-rocks-${{ steps.release_version.outputs.version }}-macos.zip
          archive: false
          if-no-files-found: error

  publish-local-alpha:
    name: Publish versioned local alpha prerelease
    if: startsWith(github.ref, 'refs/tags/local-v')
    needs:
      - windows-local-alpha
      - macos-local-alpha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read release version
        id: release_version
        run: echo "version=$(tr -d '\r\n' < tools/release/version.txt)" >> "$GITHUB_OUTPUT"
      - name: Download tested release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          mkdir release
          windows_archive="space-rocks-${RELEASE_VERSION}-windows-x86_64.zip"
          macos_archive="space-rocks-${RELEASE_VERSION}-macos.zip"
          windows_artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq ".artifacts[] | select(.name == \"$windows_archive\") | .id")"
          macos_artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq ".artifacts[] | select(.name == \"$macos_archive\") | .id")"
          test -n "$windows_artifact_id"
          test -n "$macos_artifact_id"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$windows_artifact_id/zip" > "release/$windows_archive"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$macos_artifact_id/zip" > "release/$macos_archive"
      - name: Verify release archives
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          test -s "release/space-rocks-${RELEASE_VERSION}-windows-x86_64.zip"
          test -s "release/space-rocks-${RELEASE_VERSION}-macos.zip"
          unzip -tq "release/space-rocks-${RELEASE_VERSION}-windows-x86_64.zip"
          unzip -tq "release/space-rocks-${RELEASE_VERSION}-macos.zip"
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          expected_tag="local-v$RELEASE_VERSION"
          release_tag="$GITHUB_REF_NAME"
          test "$release_tag" = "$expected_tag"
          release_title="Space Rocks $RELEASE_VERSION"
          cat > release-notes.md <<EOF
          Native Windows and macOS local packaged alpha builds for Space Rocks $RELEASE_VERSION.

          Both packages passed their native automated packaged smoke tests for commit \`$GITHUB_SHA\`.

          Windows: extract the archive and run \`install.ps1\`.
          macOS: extract the archive and run \`install.command\`. The app is ad-hoc signed and is not notarized.
          EOF
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" release/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --title "$release_title" --notes-file release-notes.md --prerelease --latest=false
          else
            gh release create "$release_tag" release/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$release_title" --notes-file release-notes.md --prerelease --latest=false
          fi
