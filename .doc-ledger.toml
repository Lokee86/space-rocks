root = "docs"
index_file = "!INDEX.md"

[markers]
prefix = "doc-ledger"

[parent_link]
label = "Parent index"
folder_indexes = true
indexed_files = true

[sections.files]
heading = "Direct Files"

[sections.stubs]
heading = "Stub Files"

[sections.folders]
heading = "Direct Folders"

[aliases]
files = ["Top-Level Files"]
folders = ["Top-Level Folders"]

[drafts]
folder = "stubs"
description_prefix = "Stub: "

[files]
include_patterns = ["**/*.md"]
exclude_patterns = []

[editable]
parent_index_extensions = [".md"]

[descriptions]
file_template = "{title} documentation."
folder_template = "{title} documentation."

[watch]
debounce_seconds = 1.25
ignored_dirs = [".git", ".cache", "__pycache__"]
ignored_suffixes = ["~", ".swp", ".tmp", ".bak"]

[template]
include_ownership = true
include_does_not_belong = true
include_related_docs = true
include_notes = true

[frontmatter]
enabled = true
default_format = "yaml"
allowed_formats = ["yaml", "toml"]
default_author = "brian"
unknown_fields = "remove"

[frontmatter.fields.document_id]
type = "uuid"
required = true
immutable = true
generated = true

[frontmatter.fields.author]
type = "string"
required = true
default_from = "frontmatter.default_author"

[frontmatter.fields.document_type]
type = "string"
required = true
default = "general"

[frontmatter.fields.created]
type = "date"
required = true
immutable = true
generated = true

[frontmatter.fields.summary]
type = "string"
required = true

[frontmatter.fields.policy_exempt]
type = "boolean"
default = false

[frontmatter.fields.policy_exempt_reason]
type = "string"

[[frontmatter.rules]]
when_field = "policy_exempt"
equals = true
require = "policy_exempt_reason"
